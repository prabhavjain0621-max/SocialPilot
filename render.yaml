services:
  # FastAPI Backend Web Service
  - type: web
    name: socialpilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: socialpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://your-socialpilot.vercel.app"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"

databases:
  # Render Managed PostgreSQL Database
  - name: socialpilot-db
    databaseName: socialpilot
    user: socialpilot_user
    plan: free
